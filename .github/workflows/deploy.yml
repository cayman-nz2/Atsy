# Deploys to Cloudflare Workers on every merge to main, gated on the same
# checks that run locally. workflow_dispatch is the recovery path: GitHub
# occasionally drops push events silently, so if a merge produces no run,
# dispatch this manually and confirm it goes green.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Pull requests run the same gates, so nothing merges untested.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploys must land in merge order: two quick merges otherwise race and the
# older SHA can publish last while both runs show green.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung step has no natural end: GitHub's default is six hours, so a
    # wedged runner blocks every deploy behind it for the rest of the day
    # rather than failing and being re-run. The whole job takes ~90 seconds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      # `--with-deps` runs apt-get, which is the one step here that depends on a
      # mirror rather than on this repository. It has hung for 30+ minutes with
      # no output while the identical commit installed in 24 seconds minutes
      # earlier, so it is bounded and has a fallback: the ubuntu-latest image
      # already carries Chromium's shared libraries, and the browser download
      # itself does not need apt.
      #
      # This does not weaken the gate. If the browser cannot actually run, the
      # end-to-end step below fails exactly as it would have.
      - name: Install Playwright browser
        id: playwright
        timeout-minutes: 6
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser without the apt step
        if: steps.playwright.outcome != 'success'
        timeout-minutes: 6
        run: |
          echo "::warning::installing Chromium with system deps did not finish; retrying without apt"
          npx playwright install chromium

      # Journeys, the layout-overlap gate, the horizontal-scroll gate and the
      # stale-build gate all run here against a real `wrangler dev`.
      - name: End-to-end tests
        run: npm run e2e

      # When the dev server dies mid-suite, every test after it fails with
      # ERR_CONNECTION_REFUSED and the one useful account of what happened is
      # workerd's own log — which the runner then throws away. That is exactly
      # what made incident 59 unexplainable, so keep it.
      - name: Collect the dev server's log when the suite fails
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp -r "$HOME/.config/.wrangler/logs/." e2e-logs/ 2>/dev/null || true
          echo "collected:"; ls -la e2e-logs 2>/dev/null || echo "  (no wrangler logs found)"

      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            e2e-logs
            test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Until the owner adds the Cloudflare credentials, this job is skipped
    # rather than failing: a red main would block every merge for a reason
    # that is not a defect. It starts deploying the moment the secrets exist.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping the deploy. Add them in Settings → Secrets and variables → Actions."
          fi

      # A Worker whose D1 binding points at a placeholder id fails at runtime,
      # not at deploy time. Refuse to publish instead, and say what to do.
      #
      # The database name is read out of wrangler.jsonc here and used by the
      # migration step below. It was written out by hand there once, and the
      # rename for the move to Oceania left it pointing at a database that no
      # longer existed: the deploy failed with "Couldn't find a D1 DB with the
      # name or binding 'atsy-db'". One source, no second copy to forget.
      - name: Check the database binding is real
        id: db
        run: |
          name=$(node tools/binding-names.mjs d1-name)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if grep -q 'PLACEHOLDER-RUN-WRANGLER-D1-CREATE-ATSY-DB' wrangler.jsonc; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::wrangler.jsonc still has the placeholder database_id — skipping the deploy. Run 'wrangler d1 create ${name} --location oc' and paste the id into wrangler.jsonc."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "migrations will be applied to ${name}"
          fi

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        run: npm ci

      - name: Build assets
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        run: npm run build

      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: d1 migrations apply ${{ steps.db.outputs.name }} --remote

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v3 bundles wrangler 3.x by default, which cannot
          # parse an assets Worker config ("Missing entry-point"). Pin 4.x.
          wranglerVersion: "4.118.0"

      # The secrets that matter are the ones on the Worker, not the ones in
      # GitHub. Provisioning writes TURNSTILE_SECRET_KEY, CV_MASTER_KEY and
      # IP_HASH_SALT straight to the Worker with `wrangler secret put`, so they
      # deliberately have no GitHub counterpart. Checking GitHub alone reported
      # "the bot shield is OFF" on a deploy where the shield was on — a warning
      # that lies in the safe-sounding direction is worse than none. Ask the
      # Worker, and warn only about what is genuinely absent there.
      - name: Check the Worker's secrets are in place
        id: worker_secrets
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # `secret list` prints names only — never values — so this is safe to
          # capture. A failure here must not read as "no secrets": distinguish
          # the two, because they call for opposite responses.
          if ! names=$(npx wrangler@4.118.0 secret list --name atsy 2>/dev/null); then
            echo "::warning::could not list the Worker's secrets — skipping the check rather than guessing at it"
            echo "checked=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "checked=yes" >> "$GITHUB_OUTPUT"
          for name in TURNSTILE_SECRET_KEY CV_MASTER_KEY IP_HASH_SALT; do
            if echo "$names" | grep -q "\"$name\""; then
              echo "$name is set on the Worker"
            else
              case "$name" in
                TURNSTILE_SECRET_KEY)
                  echo "::warning::TURNSTILE_SECRET_KEY is missing from the Worker — the bot shield is OFF (rate limits still apply). Run the Provision workflow." ;;
                CV_MASTER_KEY)
                  echo "::warning::CV_MASTER_KEY is missing from the Worker — CV uploads will fail closed rather than store anything unencrypted. Run the Provision workflow." ;;
                IP_HASH_SALT)
                  echo "::warning::IP_HASH_SALT is missing from the Worker — rate-limit hashes fall back to a known development salt. Run the Provision workflow." ;;
              esac
            fi
          done

      # Kept as a recovery path: if provisioning could not create the widget
      # (no Turnstile:Edit on the token), the owner adds the secret to GitHub
      # instead and this syncs it. Normally there is nothing to sync, and that
      # is not a problem — the check above is what reports a real gap.
      #
      # The presence test needs its own step because the `secrets` context is
      # not available in a step-level `if`; only an output from a prior step is.
      - name: Look for a GitHub-held Turnstile secret
        id: ts
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        env:
          TS: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: echo "has=${TS:+yes}" >> "$GITHUB_OUTPUT"

      - name: Sync the GitHub-held Turnstile secret to the Worker
        if: steps.ts.outputs.has == 'yes'
        uses: cloudflare/wrangler-action@v3
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          secrets: |
            TURNSTILE_SECRET_KEY

      - name: Look for a GitHub-held IP hash salt
        id: salt
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        env:
          SALT: ${{ secrets.IP_HASH_SALT }}
        run: echo "has=${SALT:+yes}" >> "$GITHUB_OUTPUT"

      - name: Sync the GitHub-held IP hash salt to the Worker
        if: steps.salt.outputs.has == 'yes'
        uses: cloudflare/wrangler-action@v3
        env:
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          secrets: |
            IP_HASH_SALT

      # A green deploy serving the wrong build is worse than a red one:
      # poll /api/health until the live version matches this checkout.
      # /privacy names the region a reader's CV and account row sit in. That is
      # a promise about somebody's personal data, so it is asserted rather than
      # trusted: if the bucket or the database is ever recreated somewhere else,
      # this fails and the page never gets to quietly say the wrong country.
      #
      # A failure here does NOT mean the deploy was bad — the Worker is already
      # live by this point. It means the privacy page needs correcting, which is
      # the more urgent of the two.
      - name: The privacy page's storage regions still match reality
        if: steps.creds.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # The page says "Oceania" in prose; Cloudflare's API says "OC". Map
          # the one the reader sees onto the one the API returns, so the page
          # never has to carry a region code just to satisfy this check.
          if grep -q 'Oceania' public/privacy.html; then
            claimed=OC
          elif grep -q 'eastern North America' public/privacy.html; then
            claimed=ENAM
          else
            echo "::error::/privacy no longer names a storage region — it must say where the data is"
            exit 1
          fi

          read_region() {
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/$1" \
              | node -e "
                let raw = '';
                process.stdin.on('data', (c) => { raw += c; });
                process.stdin.on('end', () => {
                  try {
                    const r = (JSON.parse(raw).result) || {};
                    console.log(r.location || r.running_in_region || '');
                  } catch { console.log(''); }
                });
              "
          }

          # Both names come from wrangler.jsonc, so this checks whatever the
          # Worker is actually bound to rather than a copy that can go stale.
          bucket_name=$(node tools/binding-names.mjs r2-bucket)
          database_id=$(node tools/binding-names.mjs d1-id)

          bucket=$(read_region "r2/buckets/${bucket_name}")
          database=$(read_region "d1/database/${database_id}")

          # An unreachable API leaves both empty, and two empty strings must not
          # read as agreement — that is how a check proves nothing.
          if [ -z "$bucket" ] || [ -z "$database" ]; then
            echo "::warning::could not read the storage regions from Cloudflare (bucket='${bucket}' database='${database}') — not treating that as a mismatch"
            exit 0
          fi

          echo "page claims ${claimed}; R2 is ${bucket}; D1 is ${database}"
          if [ "$bucket" != "$claimed" ] || [ "$database" != "$claimed" ]; then
            echo "::error::/privacy says data is stored in ${claimed}, but R2 is in ${bucket} and D1 is in ${database}. Correct the privacy page."
            exit 1
          fi
          echo "the privacy page and Cloudflare agree"

      - name: Verify the deployed version
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        run: |
          expected=$(grep -o "'[0-9][0-9.]*'" src/version.js | tr -d "'")
          # Without this, a grep that stops matching would leave `expected`
          # empty, an unreachable site would leave `live` empty, and the
          # comparison would pass: a green deploy proving nothing.
          if [ -z "$expected" ]; then
            echo "::error::could not read VERSION out of src/version.js"; exit 1
          fi
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS https://atsy.vibecod3.app/api/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
            if [ -n "$live" ] && [ "$live" = "$expected" ]; then
              echo "live version $live matches"; exit 0
            fi
            echo "attempt $i: live='${live}' expected='${expected}' — retrying"; sleep 10
          done
          echo "::error::the deployed version never matched (wanted $expected, saw '${live}')"; exit 1

      # The sign-in page is the front door, and its bot check is the only
      # third-party script Atsy loads. A page served TWO Content-Security-Policy
      # headers is held to both, and the browser takes the stricter value for
      # each directive — so the site-wide `script-src 'self'` silently overrode
      # the /app rule that admits Turnstile, and the widget could not load on
      # the live site. Nothing local catches a `_headers` merge going wrong on
      # the edge, so it is asserted here, against production, on every deploy.
      - name: The sign-in page still admits its bot check
        if: steps.creds.outputs.ready == 'yes' && steps.db.outputs.ready == 'yes'
        run: |
          headers=$(curl -fsSL -o /dev/null -D - https://atsy.vibecod3.app/app || true)
          if [ -z "$headers" ]; then
            echo "::warning::could not reach /app to read its headers — not treating that as a failure"
            exit 0
          fi
          count=$(printf '%s\n' "$headers" | grep -ci '^content-security-policy:' || true)
          if [ "$count" != "1" ]; then
            echo "::error::/app is served ${count} Content-Security-Policy headers. A browser enforces every one of them, so the strictest wins and the bot check cannot load. Exactly one is required."
            printf '%s\n' "$headers" | grep -i '^content-security-policy:'
            exit 1
          fi
          if ! printf '%s\n' "$headers" | grep -i '^content-security-policy:' | grep -q 'challenges.cloudflare.com'; then
            echo "::error::/app's CSP does not allow challenges.cloudflare.com — the sign-in bot check will not load."
            printf '%s\n' "$headers" | grep -i '^content-security-policy:'
            exit 1
          fi
          echo "/app carries one CSP and it admits the bot check"
