# Deploys to Cloudflare Workers on every merge to main, gated on the same
# checks that run locally. workflow_dispatch is the recovery path: GitHub
# occasionally drops push events silently, so if a merge produces no run,
# dispatch this manually and confirm it goes green.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys must land in merge order: two quick merges otherwise race and the
# older SHA can publish last while both runs show green.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Journeys, the layout-overlap gate, the horizontal-scroll gate and the
      # stale-build gate all run here against a real `wrangler dev`.
      - name: End-to-end tests
        run: npm run e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Until the owner adds the Cloudflare credentials, this job is skipped
    # rather than failing: a red main would block every merge for a reason
    # that is not a defect. It starts deploying the moment the secrets exist.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials are present
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping the deploy. Add them in Settings → Secrets and variables → Actions."
          fi

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'yes'
        run: npm ci

      - name: Build assets
        if: steps.creds.outputs.ready == 'yes'
        run: npm run build

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v3 bundles wrangler 3.x by default, which cannot
          # parse an assets Worker config ("Missing entry-point"). Pin 4.x.
          wranglerVersion: "4.118.0"

      # A green deploy serving the wrong build is worse than a red one:
      # poll /api/health until the live version matches this checkout.
      - name: Verify the deployed version
        if: steps.creds.outputs.ready == 'yes'
        run: |
          expected=$(grep -o "'[0-9][0-9.]*'" src/version.js | tr -d "'")
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS https://atsy.vibecod3.app/api/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$live" = "$expected" ]; then echo "live version $live matches"; exit 0; fi
            echo "attempt $i: live=$live expected=$expected — retrying"; sleep 10
          done
          echo "::error::the deployed version never matched (wanted $expected, saw $live)"; exit 1
